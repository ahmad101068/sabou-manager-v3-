name: Dashboard UX2 Fix17 Final Host Gates

on:
  workflow_dispatch:
  push:
    branches: [dashboard-ux2-fix1-ci]
    paths:
      - '_ci/apply-dashboard-ux2-fix17.py'
      - '.github/workflows/dashboard-ux2-fix17-host.yml'

permissions:
  contents: read

concurrency:
  group: dashboard-ux2-fix17-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-gates:
    name: Fix17 static compile unit lint and APK gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_ZIP: Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct source through fix17
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _project && mkdir -p _project
          unzip -q "$SOURCE_ZIP" -d _project
          PROJECT_DIR="$(find _project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/alpha1621_compilefix.patch"
          cat "$GITHUB_WORKSPACE"/_ci/personnel21.patch.gz.b64.* | base64 --decode --ignore-garbage | gzip -dc | patch --forward --batch -p1
          for p in personnel21-fix2.patch personnel21-fix3.patch personnel21-fix4.patch personnel21-fix5.patch; do patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/$p"; done
          cat "$GITHUB_WORKSPACE"/_ci/dashboard-ux2-v2.patch.gz.b64.* | base64 --decode --ignore-garbage > "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -t "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -dc "$RUNNER_TEMP/dashboard-ux2.patch.gz" | patch --forward --batch -p1
          for n in $(seq 1 17); do python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix${n}.py"; done
          chmod +x gradlew
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Static quality gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/verify-alpha162-code-quality.py | tee "$GITHUB_WORKSPACE/static-code-quality.log"
          python3 scripts/verify-alpha162-enterprise-core.py | tee "$GITHUB_WORKSPACE/static-enterprise-core.log"
          python3 scripts/verify-hr-payroll-migration.py | tee "$GITHUB_WORKSPACE/static-hr-payroll-migration.log"
          python3 scripts/verify-dashboard-ux2.py | tee "$GITHUB_WORKSPACE/static-dashboard-ux2.log"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic
      - name: Prewarm Gradle
        shell: bash
        run: |
          chmod +x _ci/prewarm-gradle.sh
          _ci/prewarm-gradle.sh
      - name: Compile debug Kotlin
        shell: bash
        run: cd "$PROJECT_DIR" && ./gradlew --no-daemon --console=plain compileDebugKotlin --stacktrace |& tee "$GITHUB_WORKSPACE/compileDebugKotlin.log"
      - name: Debug unit tests
        shell: bash
        run: cd "$PROJECT_DIR" && ./gradlew --no-daemon --console=plain testDebugUnitTest --stacktrace |& tee "$GITHUB_WORKSPACE/testDebugUnitTest.log"
      - name: Lint debug
        shell: bash
        run: cd "$PROJECT_DIR" && ./gradlew --no-daemon --console=plain lintDebug --stacktrace |& tee "$GITHUB_WORKSPACE/lintDebug.log"
      - name: Compile release Kotlin
        shell: bash
        run: cd "$PROJECT_DIR" && ./gradlew --no-daemon --console=plain compileReleaseKotlin --stacktrace |& tee "$GITHUB_WORKSPACE/compileReleaseKotlin.log"
      - name: Assemble APKs
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace |& tee "$GITHUB_WORKSPACE/assembleAll.log"
      - name: Stage APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _apk_output
          cp "$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -1)" _apk_output/Sabou-fix17-debug.apk
          cp "$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -1)" _apk_output/Sabou-fix17-release.apk
          cp "$(find "$PROJECT_DIR/app/build/outputs/apk/androidTest/debug" -maxdepth 1 -type f -name '*.apk' | head -1)" _apk_output/Sabou-fix17-androidTest.apk
          sha256sum _apk_output/*.apk | tee _apk_output/SHA256SUMS.txt
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Dashboard-UX2-fix17-apks-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: _apk_output/*
      - name: Upload host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Dashboard-UX2-fix17-host-evidence-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            static-*.log
            compileDebugKotlin.log
            testDebugUnitTest.log
            lintDebug.log
            compileReleaseKotlin.log
            assembleAll.log
