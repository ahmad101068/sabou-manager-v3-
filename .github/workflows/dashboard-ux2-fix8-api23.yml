name: Dashboard UX2 Fix8 API23

on:
  workflow_dispatch:
  push:
    branches:
      - dashboard-ux2-fix1-ci
    paths:
      - "_ci/apply-dashboard-ux2-fix8.py"
      - ".github/workflows/dashboard-ux2-fix8-api23.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-ux2-fix8-api23-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api23:
    name: Fix8 AndroidTest compile and API23
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_ZIP: Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct source through fix8
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _project
          mkdir -p _project _ci/logs
          unzip -q "$SOURCE_ZIP" -d _project
          PROJECT_DIR="$(find _project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/alpha1621_compilefix.patch"
          cat "$GITHUB_WORKSPACE"/_ci/personnel21.patch.gz.b64.* | base64 --decode --ignore-garbage | gzip -dc | patch --forward --batch -p1
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix2.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix3.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix4.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix5.patch"
          cat "$GITHUB_WORKSPACE"/_ci/dashboard-ux2-v2.patch.gz.b64.* | base64 --decode --ignore-garbage > "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -t "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -dc "$RUNNER_TEMP/dashboard-ux2.patch.gz" | patch --forward --batch -p1
          for n in 1 2 3 4 5 6 7 8; do
            python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix${n}.py"
          done
          chmod +x gradlew
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Prewarm Gradle
        shell: bash
        run: |
          chmod +x _ci/prewarm-gradle.sh
          _ci/prewarm-gradle.sh

      - name: Compile AndroidTest APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebugAndroidTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/_ci/logs/assembleDebugAndroidTest-fix8.log"

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run all instrumentation on API23
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 23
          target: google_apis
          arch: x86_64
          profile: "Nexus 6"
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: |
            bash -lc 'set -o pipefail; cd "$PROJECT_DIR"; set +e; ./gradlew --no-daemon --console=plain connectedDebugAndroidTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/_ci/logs/connectedDebugAndroidTest-fix8-api23.log"; STATUS=${PIPESTATUS[0]}; adb logcat -d > "$GITHUB_WORKSPACE/_ci/logs/logcat-fix8-api23.txt" 2>&1 || true; exit $STATUS'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-fix8-api23-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            _ci/logs/
            _project/**/app/build/reports/androidTests/
            _project/**/app/build/outputs/androidTest-results/
            _project/**/app/schemas/
