name: Restore canonical Room schema history

on:
  push:
    branches:
      - release/v1.0.0
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: restore-canonical-room-schema-history
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect whether restore is required
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          dir='app/schemas/ir.restaurant.management.data.db.AppDatabase'
          missing=false
          for v in 56 57 58 60; do
            if [[ ! -s "$dir/$v.json" ]]; then missing=true; fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Reconstruct verified Phase 8.1 source
        if: steps.guard.outputs.missing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/reconstruct-phase8-1-candidate.sh phase8-1-source

      - name: Recover authentic historical schemas
        if: steps.guard.outputs.missing == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/recover-phase8-1-schemas.sh phase8-1-source

      - name: Restore exact schema history
        if: steps.guard.outputs.missing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          src='phase8-1-source/app/schemas/ir.restaurant.management.data.db.AppDatabase'
          dst='app/schemas/ir.restaurant.management.data.db.AppDatabase'
          mkdir -p "$dst"
          for v in 56 57 58 60; do cp "$src/$v.json" "$dst/$v.json"; done
          echo '3218181977b7fb8079bd478db3eac97c72874628da427d0b39b6ef2fe12f92fd  app/schemas/ir.restaurant.management.data.db.AppDatabase/56.json' | sha256sum -c -
          echo '50eb41e5dc49e6b0f03275510f32c2ef9ac49db0ad157253be0531650cb88894  app/schemas/ir.restaurant.management.data.db.AppDatabase/57.json' | sha256sum -c -
          echo '3ff188efb092b87ecaa6b3db3a4285a1f6749a992e2ea8611e15c61aade0a0d5  app/schemas/ir.restaurant.management.data.db.AppDatabase/58.json' | sha256sum -c -
          echo '209deaa5ffa9bb562609395d6cdbf09dc70a6fd7105c32693939e82db81e5389  app/schemas/ir.restaurant.management.data.db.AppDatabase/60.json' | sha256sum -c -
          rm -rf phase8-1-source history

      - name: Commit restored schema history
        if: steps.guard.outputs.missing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/schemas/ir.restaurant.management.data.db.AppDatabase/{56,57,58,60}.json
          git commit -m 'release: restore verified Room schema history for migration tests'
          git push origin HEAD:release/v1.0.0
