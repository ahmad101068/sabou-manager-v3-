name: Prepare Android Test Orchestrator Cache

on:
  push:
    branches: [tools/offline-android-deps]
    paths:
      - .github/workflows/prepare-test-orchestrator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORCH_GRADLE_HOME: ${{ github.workspace }}/orchestrator-gradle-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Resolve Android Test Orchestrator
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/orchestrator-resolver"
          mkdir -p "$PROJECT"
          cat > "$PROJECT/settings.gradle.kts" <<'EOF'
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "orchestrator-resolver"
          EOF
          cat > "$PROJECT/build.gradle.kts" <<'EOF'
          val androidTestUtil by configurations.creating
          dependencies {
              add("androidTestUtil", "androidx.test:orchestrator:1.6.1")
          }
          tasks.register<Copy>("resolveOrchestrator") {
              from(androidTestUtil)
              into(layout.buildDirectory.dir("resolved"))
          }
          EOF
          cd "$PROJECT"
          GRADLE_USER_HOME="$ORCH_GRADLE_HOME" gradle --no-daemon resolveOrchestrator
          GRADLE_USER_HOME="$ORCH_GRADLE_HOME" gradle --offline --no-daemon resolveOrchestrator
          find build/resolved -maxdepth 1 -type f -print -exec sha256sum {} \;
      - name: Package cache
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/orchestrator-out"
          mkdir -p "$OUT"
          tar -C "$ORCH_GRADLE_HOME" -czf "$OUT/android-test-orchestrator-gradle-home.tar.gz" .
          sha256sum "$OUT/android-test-orchestrator-gradle-home.tar.gz" > "$OUT/android-test-orchestrator-gradle-home.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-orchestrator-1.6.1-cache
          path: |
            ${{ runner.temp }}/orchestrator-out/android-test-orchestrator-gradle-home.tar.gz
            ${{ runner.temp }}/orchestrator-out/android-test-orchestrator-gradle-home.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
