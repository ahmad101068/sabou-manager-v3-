name: Build v1.0.0 AAB Handoff

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v1-aab-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.0.0 source
        uses: actions/checkout@v4
        with:
          ref: v1.0.0
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build unsigned release AAB
        run: ./gradlew --no-daemon --no-build-cache :app:bundleRelease

      - name: Record provenance
        run: |
          set -euo pipefail
          mkdir -p release-handoff
          git rev-parse HEAD > release-handoff/source-sha.txt
          sha256sum app/build/outputs/bundle/release/app-release.aab > release-handoff/aab-sha256.txt
          cp app/build/outputs/bundle/release/app-release.aab release-handoff/sabou-manager-v1.0.0-release-unsigned.aab

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: sabou-v1.0.0-unsigned-aab
          path: release-handoff/
          if-no-files-found: error
          retention-days: 30
