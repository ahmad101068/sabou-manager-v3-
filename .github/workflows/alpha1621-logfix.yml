name: Alpha162.1 compile logfix 85337093064

on:
  push:
    branches:
      - alpha1621-ci-compile-fix-85337093064

permissions:
  contents: read

jobs:
  compile-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Extract exact Alpha162.1 source and apply root-cause patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip -d project
          PROJECT_DIR="$(find project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          patch -p1 < "$GITHUB_WORKSPACE/_ci/alpha1621_compilefix.patch"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Existing static gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash scripts/verify-foundation.sh
          bash scripts/verify-alpha161-professional-erp.sh
          python3 scripts/verify-alpha161-sql.py
          python3 scripts/verify-alpha161-ci-logfix.py
          python3 scripts/verify-hr-payroll-migration.py
          python3 scripts/verify-runtime-crash-repair.py
          python3 scripts/verify-alpha162-enterprise-core.py
          python3 scripts/verify-alpha162-code-quality.py
      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileDebugKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/compile.log"
      - name: Unit test and debug assemble
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/post-compile.log"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha1621-logfix-85337093064
          if-no-files-found: warn
          path: |
            compile.log
            post-compile.log
            project/**/app/build/reports/
            project/**/app/build/test-results/
            project/**/app/build/outputs/apk/debug/*.apk
