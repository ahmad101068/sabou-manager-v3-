name: Dashboard UX2 Fix7 CI

on:
  workflow_dispatch:
  push:
    branches:
      - dashboard-ux2-fix1-ci
    paths:
      - "_ci/apply-dashboard-ux2-fix7.py"
      - ".github/workflows/dashboard-ux2-fix7-ci.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-ux2-fix7-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Fix7 static compile unit lint APK gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_ZIP: Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct current source through fix7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _project
          mkdir -p _project
          test -f "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d _project
          PROJECT_DIR="$(find _project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/alpha1621_compilefix.patch"
          cat "$GITHUB_WORKSPACE"/_ci/personnel21.patch.gz.b64.* | base64 --decode --ignore-garbage | gzip -dc | patch --forward --batch -p1
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix2.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix3.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix4.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix5.patch"
          cat "$GITHUB_WORKSPACE"/_ci/dashboard-ux2-v2.patch.gz.b64.* | base64 --decode --ignore-garbage > "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -t "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -dc "$RUNNER_TEMP/dashboard-ux2.patch.gz" | patch --forward --batch -p1
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix1.py"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix2.py"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix3.py"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix4.py"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix5.py"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix6.py"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix7.py"
          chmod +x gradlew
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Static quality gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/verify-alpha162-code-quality.py | tee "$GITHUB_WORKSPACE/static-code-quality.log"
          python3 scripts/verify-alpha162-enterprise-core.py | tee "$GITHUB_WORKSPACE/static-enterprise-core.log"
          python3 scripts/verify-hr-payroll-migration.py | tee "$GITHUB_WORKSPACE/static-hr-payroll-migration.log"
          python3 scripts/verify-dashboard-ux2.py | tee "$GITHUB_WORKSPACE/static-dashboard-ux2.log"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileDebugKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/compileDebugKotlin.log"

      - name: Debug unit tests
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/testDebugUnitTest.log"

      - name: Lint debug
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain lintDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/lintDebug.log"

      - name: Compile release Kotlin
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileReleaseKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/compileReleaseKotlin.log"

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/assembleDebug.log"

      - name: Assemble AndroidTest APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebugAndroidTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/assembleDebugAndroidTest.log"

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/assembleRelease.log"

      - name: Stage APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _apk_output
          DEBUG_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RELEASE_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          TEST_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/androidTest/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$DEBUG_APK" && test -n "$RELEASE_APK" && test -n "$TEST_APK"
          cp "$DEBUG_APK" _apk_output/Sabou-fix7-debug.apk
          cp "$RELEASE_APK" _apk_output/Sabou-fix7-release.apk
          cp "$TEST_APK" _apk_output/Sabou-fix7-androidTest.apk
          sha256sum _apk_output/*.apk > _apk_output/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Dashboard-UX2-fix7-apks-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: _apk_output/*

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Dashboard-UX2-fix7-host-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            static-*.log
            compileDebugKotlin.log
            testDebugUnitTest.log
            lintDebug.log
            compileReleaseKotlin.log
            assembleDebug.log
            assembleDebugAndroidTest.log
            assembleRelease.log
