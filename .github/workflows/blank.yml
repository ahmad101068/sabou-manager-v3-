name: Build Sabou Manager APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Source ZIP filename"
        required: false
        default: "Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip"
        type: string
  push:
    branches:
      - main
      - personnel21-ci
      - dashboard-ux2-ci
    paths:
      - "Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip"
      - "_ci/alpha1621_compilefix.patch"
      - "_ci/personnel21.patch.gz.b64.*"
      - "_ci/personnel21-fix2.patch"
      - "_ci/personnel21-fix3.patch"
      - "_ci/personnel21-fix4.patch"
      - "_ci/personnel21-fix5.patch"
      - "_ci/dashboard-ux2-v2.patch.gz.b64.*"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

concurrency:
  group: sabou-build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile, test and build Dashboard UX 2.0
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      DEFAULT_SOURCE_ZIP: Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          INPUT_ZIP="${{ github.event.inputs.source_zip || '' }}"
          ZIP="${INPUT_ZIP:-$DEFAULT_SOURCE_ZIP}"
          test -f "$ZIP" || { echo "Source ZIP not found: $ZIP"; exit 1; }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source and apply verified patches
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _apk_project
          mkdir -p _apk_project
          unzip -q "${{ steps.source.outputs.zip }}" -d _apk_project
          PROJECT_DIR="$(find _apk_project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "Android project not found inside source ZIP"; exit 1; }
          test -f "$PROJECT_DIR/gradlew" || { echo "gradlew not found in $PROJECT_DIR"; exit 1; }
          cd "$PROJECT_DIR"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/alpha1621_compilefix.patch"
          cat "$GITHUB_WORKSPACE"/_ci/personnel21.patch.gz.b64.* | base64 --decode --ignore-garbage | gzip -dc | patch --forward --batch -p1
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix2.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix3.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix4.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix5.patch"
          cat "$GITHUB_WORKSPACE"/_ci/dashboard-ux2-v2.patch.gz.b64.* | base64 --decode --ignore-garbage > "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -t "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -dc "$RUNNER_TEMP/dashboard-ux2.patch.gz" > "$RUNNER_TEMP/dashboard-ux2.patch"
          patch --forward --batch -p1 < "$RUNNER_TEMP/dashboard-ux2.patch"
          chmod +x gradlew
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Run static quality gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/verify-alpha162-code-quality.py | tee "$GITHUB_WORKSPACE/static-code-quality.log"
          python3 scripts/verify-alpha162-enterprise-core.py | tee "$GITHUB_WORKSPACE/static-enterprise-core.log"
          python3 scripts/verify-hr-payroll-migration.py | tee "$GITHUB_WORKSPACE/static-hr-payroll-migration.log"
          python3 scripts/verify-dashboard-ux2.py | tee "$GITHUB_WORKSPACE/static-dashboard-ux2.log"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileDebugKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/compileDebugKotlin.log"

      - name: Run debug unit tests
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/testDebugUnitTest.log"

      - name: Lint debug
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          set +e
          ./gradlew --no-daemon --console=plain lintDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/lintDebug.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$REPORT" ]; then
              echo "===== FULL LINT REPORT ====="
              cat "$REPORT"
            fi
            exit "$STATUS"
          fi

      - name: Compile release Kotlin
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileReleaseKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/compileReleaseKotlin.log"

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/assembleDebug.log"

      - name: Assemble AndroidTest
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebugAndroidTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/assembleDebugAndroidTest.log"

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleRelease --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/assembleRelease.log"

      - name: Verify and stage APKs
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RELEASE_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$DEBUG_APK" || { echo "assembleDebug finished but no APK was found"; exit 1; }
          test -n "$RELEASE_APK" || { echo "assembleRelease finished but no APK was found"; exit 1; }
          mkdir -p _apk_output
          cp "$DEBUG_APK" _apk_output/Sabou-Dashboard-UX2-debug.apk
          cp "$RELEASE_APK" _apk_output/Sabou-Dashboard-UX2-release.apk
          sha256sum _apk_output/Sabou-Dashboard-UX2-debug.apk | tee _apk_output/Sabou-Dashboard-UX2-debug.apk.sha256
          sha256sum _apk_output/Sabou-Dashboard-UX2-release.apk | tee _apk_output/Sabou-Dashboard-UX2-release.apk.sha256

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Dashboard-UX2-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            _apk_output/Sabou-Dashboard-UX2-debug.apk
            _apk_output/Sabou-Dashboard-UX2-debug.apk.sha256
            _apk_output/Sabou-Dashboard-UX2-release.apk
            _apk_output/Sabou-Dashboard-UX2-release.apk.sha256

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Dashboard-UX2-build-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            static-*.log
            compileDebugKotlin.log
            testDebugUnitTest.log
            lintDebug.log
            compileReleaseKotlin.log
            assembleDebug.log
            assembleDebugAndroidTest.log
            assembleRelease.log
