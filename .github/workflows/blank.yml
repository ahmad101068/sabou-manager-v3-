name: Build Sabou Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Sabou-Manager-v3-alpha19-dev-source.zip"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          test -f Sabou-Manager-v3-alpha19-dev-source.zip
          mkdir -p project
          unzip -q Sabou-Manager-v3-alpha19-dev-source.zip -d project
          ls -la project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set executable
        working-directory: project
        run: chmod +x gradlew

      - name: Build APK
        working-directory: project
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Manager-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
