name: Build Sabou Manager APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Source ZIP filename"
        required: false
        default: "Fix21.zip"
        type: string
  push:
    branches:
      - main
    paths:
      - "Fix21.zip"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

concurrency:
  group: sabou-build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile, test and build Fix21 APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      DEFAULT_SOURCE_ZIP: Fix21.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          INPUT_ZIP="${{ github.event.inputs.source_zip || '' }}"
          ZIP="${INPUT_ZIP:-$DEFAULT_SOURCE_ZIP}"
          test -f "$ZIP" || { echo "Source ZIP not found: $ZIP"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          sha256sum "$ZIP" | tee source-zip.sha256
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using source ZIP: $ZIP"

      - name: Extract Fix21 source
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _apk_project
          mkdir -p _apk_project
          unzip -q "${{ steps.source.outputs.zip }}" -d _apk_project

          PROJECT_DIR="$(find _apk_project -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "Android project not found inside source ZIP"; exit 1; }
          test -f "$PROJECT_DIR/gradlew" || { echo "gradlew not found in $PROJECT_DIR"; exit 1; }
          chmod +x "$PROJECT_DIR/gradlew"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileDebugKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/compileDebugKotlin.log"

      - name: Run debug unit tests
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/testDebugUnitTest.log"

      - name: Lint debug
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain lintDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/lintDebug.log"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/assembleDebug.log"

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "assembleDebug finished but no APK was found"; exit 1; }

          mkdir -p _apk_output
          cp "$APK" _apk_output/Sabou-Fix21-debug.apk
          sha256sum _apk_output/Sabou-Fix21-debug.apk | tee _apk_output/Sabou-Fix21-debug.apk.sha256
          ls -lh _apk_output/Sabou-Fix21-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Fix21-debug-apk-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            _apk_output/Sabou-Fix21-debug.apk
            _apk_output/Sabou-Fix21-debug.apk.sha256

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Fix21-build-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            source-zip.sha256
            compileDebugKotlin.log
            testDebugUnitTest.log
            lintDebug.log
            assembleDebug.log
