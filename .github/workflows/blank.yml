name: Build Sabou Manager APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found in repository."
            exit 1
          fi
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: Extract project
        run: |
          unzip -q "${{ steps.zip.outputs.zip }}" -d project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          DIR=$(find project -name gradlew | head -n 1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SabouManager-debug-apk
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/**/*.apk
