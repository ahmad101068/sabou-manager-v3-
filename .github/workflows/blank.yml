name: Build Sabou Manager APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Source ZIP filename"
        required: false
        default: "Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip"
        type: string
  push:
    branches:
      - main
      - personnel21-ci
    paths:
      - "Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip"
      - "_ci/alpha1621_compilefix.patch"
      - "_ci/personnel21.patch.gz.b64.*"
      - "_ci/personnel21-fix2.patch.gz.b64"
      - ".github/workflows/blank.yml"

permissions:
  contents: read

concurrency:
  group: sabou-build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile, test and build Personnel 2.1
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DEFAULT_SOURCE_ZIP: Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          INPUT_ZIP="${{ github.event.inputs.source_zip || '' }}"
          ZIP="${INPUT_ZIP:-$DEFAULT_SOURCE_ZIP}"
          test -f "$ZIP" || { echo "Source ZIP not found: $ZIP"; exit 1; }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract source and apply verified patches
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _apk_project
          mkdir -p _apk_project
          unzip -q "${{ steps.source.outputs.zip }}" -d _apk_project
          PROJECT_DIR="$(find _apk_project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "Android project not found inside source ZIP"; exit 1; }
          test -f "$PROJECT_DIR/gradlew" || { echo "gradlew not found in $PROJECT_DIR"; exit 1; }
          cd "$PROJECT_DIR"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/alpha1621_compilefix.patch"
          cat "$GITHUB_WORKSPACE"/_ci/personnel21.patch.gz.b64.* | base64 -d | gzip -dc | patch --forward --batch -p1
          base64 --decode --ignore-garbage "$GITHUB_WORKSPACE/_ci/personnel21-fix2.patch.gz.b64" | gzip -dc | patch --forward --batch -p1
          chmod +x gradlew
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Run Personnel static gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 scripts/verify-alpha162-code-quality.py | tee "$GITHUB_WORKSPACE/static-code-quality.log"
          python3 scripts/verify-alpha162-enterprise-core.py | tee "$GITHUB_WORKSPACE/static-enterprise-core.log"
          python3 scripts/verify-hr-payroll-migration.py | tee "$GITHUB_WORKSPACE/static-hr-payroll-migration.log"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileDebugKotlin --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/compileDebugKotlin.log"

      - name: Run debug unit tests
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/testDebugUnitTest.log"

      - name: Lint debug
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain lintDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/lintDebug.log"

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/assembleDebug.log"

      - name: Assemble AndroidTest
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebugAndroidTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/assembleDebugAndroidTest.log"

      - name: Verify and stage APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "assembleDebug finished but no APK was found"; exit 1; }
          mkdir -p _apk_output
          cp "$APK" _apk_output/Sabou-Personnel-2.1-debug.apk
          sha256sum _apk_output/Sabou-Personnel-2.1-debug.apk | tee _apk_output/Sabou-Personnel-2.1-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Personnel-2.1-debug-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            _apk_output/Sabou-Personnel-2.1-debug.apk
            _apk_output/Sabou-Personnel-2.1-debug.apk.sha256

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Personnel-2.1-build-logs-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            static-*.log
            compileDebugKotlin.log
            testDebugUnitTest.log
            lintDebug.log
            assembleDebug.log
            assembleDebugAndroidTest.log
