name: Dashboard UX2 Instrumentation

on:
  workflow_dispatch:
  push:
    branches:
      - dashboard-ux2-fix1-ci
    paths:
      - "_ci/apply-dashboard-ux2-fix3.py"
      - "_ci/apply-dashboard-ux2-fix4.py"
      - ".github/workflows/dashboard-ux2-instrumentation.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-ux2-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: Instrumentation API ${{ matrix.api_level }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api_level: 23
            profile: "Nexus 6"
          - api_level: 35
            profile: "pixel_5"
    env:
      SOURCE_ZIP: Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct current source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _project
          mkdir -p _project _ci/logs
          unzip -q "$SOURCE_ZIP" -d _project
          PROJECT_DIR="$(find _project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR" || { echo "Android project not found"; exit 1; }
          cd "$PROJECT_DIR"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/alpha1621_compilefix.patch"
          cat "$GITHUB_WORKSPACE"/_ci/personnel21.patch.gz.b64.* | base64 --decode --ignore-garbage | gzip -dc | patch --forward --batch -p1
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix2.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix3.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix4.patch"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/personnel21-fix5.patch"
          cat "$GITHUB_WORKSPACE"/_ci/dashboard-ux2-v2.patch.gz.b64.* | base64 --decode --ignore-garbage > "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -t "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -dc "$RUNNER_TEMP/dashboard-ux2.patch.gz" > "$RUNNER_TEMP/dashboard-ux2.patch"
          patch --forward --batch -p1 < "$RUNNER_TEMP/dashboard-ux2.patch"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix1.py"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix2.py"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix3.py"
          python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix4.py"
          chmod +x gradlew
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connectedDebugAndroidTest on API ${{ matrix.api_level }}
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: |
            bash -lc 'set -o pipefail; cd "$PROJECT_DIR"; ./gradlew --no-daemon --console=plain connectedDebugAndroidTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/_ci/logs/connectedDebugAndroidTest-api${{ matrix.api_level }}.log"'

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Dashboard-UX2-instrumentation-api${{ matrix.api_level }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            _ci/logs/
            _project/**/app/build/reports/androidTests/
            _project/**/app/build/outputs/androidTest-results/
            _project/**/app/build/outputs/managed_device_android_test_additional_output/
            _project/**/app/schemas/
