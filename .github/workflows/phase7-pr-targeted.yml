name: Phase 7 Targeted Verification

on:
  push:
    branches: [remediation/phase7-dashboard-reports-ui-20260823]
  pull_request:
    branches: [remediation/phase6-security-audit-management-20260822]

permissions:
  contents: read

concurrency:
  group: phase7-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase7-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PHASE6_HANDOFF_SHA: adda2cefa738c29e18a1f6e15d75d5fee136b042
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Reconstruct Phase-7 candidate
        run: bash .github/scripts/reconstruct-phase7-candidate.sh phase7-source

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.13'

      - name: Static Phase-7 gates
        working-directory: phase7-source
        run: |
          set -euo pipefail
          grep -Fq 'APP_DATABASE_SCHEMA_VERSION = 59' app/src/main/java/ir/restaurant/management/data/db/AppDatabase.kt
          test -n "$(find app/src/main/java -name UiPaging.kt -print -quit)"
          test -n "$(find app/src/test -name UiPagingTest.kt -print -quit)"
          test -n "$(find app/src/test -name MoneyFormatterTest.kt -print -quit)"
          test -n "$(find app/src/androidTest -name GlobalSearchIntegrationTest.kt -print -quit)"
          grep -R -Fq '۵٬۰۰۰٬۰۰۰ ریال' app/src/test
          grep -R -Fq '۳۵.۲۵٪' app/src/test
          grep -R -Fq 'size: A4 portrait' app/src/main/java
          grep -R -Fq 'PrintAttributes.MediaSize.ISO_A4' app/src/main/java
          grep -R -Fq 'BriefMetricCard("درآمد"' app/src/main/java
          if grep -R -Fq 'BriefMetricCard("Revenue"' app/src/main/java; then exit 1; fi
          if grep -R -n 'fallbackToDestructiveMigration' app/src/main/java; then exit 1; fi

      - name: Materialize deterministic Room 58 baseline
        run: |
          set -euo pipefail
          bash .github/scripts/reconstruct-phase5-candidate.sh phase5-schema-source
          cd phase5-schema-source
          gradle --no-daemon --console=plain :app:compileDebugKotlin
          test -s app/schemas/ir.restaurant.management.data.db.AppDatabase/58.json
          python3 scripts/verify-room-schema.py
          cd ..
          mkdir -p phase7-source/app/schemas/ir.restaurant.management.data.db.AppDatabase
          cp phase5-schema-source/app/schemas/ir.restaurant.management.data.db.AppDatabase/58.json phase7-source/app/schemas/ir.restaurant.management.data.db.AppDatabase/58.json

      - name: Compile Phase-7 source
        working-directory: phase7-source
        run: gradle --no-daemon --console=plain :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin

      - name: Verify Room 59 schema unchanged
        working-directory: phase7-source
        run: |
          set -euo pipefail
          test -s app/schemas/ir.restaurant.management.data.db.AppDatabase/58.json
          test -s app/schemas/ir.restaurant.management.data.db.AppDatabase/59.json
          python3 scripts/verify-room-schema.py
          grep -Fq 'APP_DATABASE_SCHEMA_VERSION = 59' app/src/main/java/ir/restaurant/management/data/db/AppDatabase.kt

      - name: Targeted Phase-7 JVM tests
        working-directory: phase7-source
        run: >-
          gradle --no-daemon --console=plain :app:testDebugUnitTest
          --tests 'ir.restaurant.management.ui.MoneyFormatterTest'
          --tests 'ir.restaurant.management.ui.UiPagingTest'
          --tests 'ir.restaurant.management.ui.*Search*'
          --tests 'ir.restaurant.management.ui.DashboardUxModelsTest'
          --tests 'ir.restaurant.management.ui.ErpDisplayFormattersTest'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Targeted API35 Phase-7 search and scope integration
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: >-
            cd "$GITHUB_WORKSPACE/phase7-source" &&
            gradle --no-daemon --no-build-cache :app:connectedDebugAndroidTest
            "-Pandroid.testInstrumentationRunnerArguments.class=ir.restaurant.management.data.repository.GlobalSearchIntegrationTest,ir.restaurant.management.data.repository.Phase6SecurityManagementIntegrationTest"

      - name: Verify API35 Phase-7 result integrity
        run: |
          set -euo pipefail
          results="phase7-source/app/build/outputs/androidTest-results/connected"
          test -d "$results"
          if grep -R -n 'failed: initializationError' "$results"; then
            echo '::error::Android instrumentation initializationError detected'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('phase7-source/app/build/outputs/androidTest-results/connected')
          xmls = list(root.rglob('TEST-*.xml'))
          if not xmls:
              raise SystemExit('no connected Android test XML found')
          total = failures = errors = skipped = 0
          seen_classes = set()
          for path in xmls:
              suite = ET.parse(path).getroot()
              total += int(suite.attrib.get('tests', 0))
              failures += int(suite.attrib.get('failures', 0))
              errors += int(suite.attrib.get('errors', 0))
              skipped += int(suite.attrib.get('skipped', 0))
              for case in suite.findall('.//testcase'):
                  if case.attrib.get('classname'):
                      seen_classes.add(case.attrib['classname'])
          if failures or errors or skipped:
              raise SystemExit(f'API35 result not clean: tests={total} failures={failures} errors={errors} skipped={skipped}')
          if not any(c.endswith('GlobalSearchIntegrationTest') for c in seen_classes):
              raise SystemExit('GlobalSearchIntegrationTest did not execute successfully')
          if total < 2:
              raise SystemExit(f'expected at least 2 targeted API35 tests, found {total}')
          print(f'PHASE7_API35_RESULT_INTEGRITY=PASS tests={total}')
          PY

      - name: Build Phase-7 report and source handoff
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:7}"
          zip_name="restaurant-management-remediation-phase7-source-${short_sha}.zip"
          schema58="phase7-source/app/schemas/ir.restaurant.management.data.db.AppDatabase/58.json"
          schema59="phase7-source/app/schemas/ir.restaurant.management.data.db.AppDatabase/59.json"
          schema58_hash="$(sha256sum "$schema58" | awk '{print $1}')"
          schema59_hash="$(sha256sum "$schema59" | awk '{print $1}')"
          api35_tests="$(python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          total = 0
          for path in Path('phase7-source/app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml'):
              total += int(ET.parse(path).getroot().attrib.get('tests', 0))
          print(total)
          PY
          )"
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'phase7-source'
          out = Path(os.environ['GITHUB_WORKSPACE']) / f"restaurant-management-remediation-phase7-source-{os.environ['SOURCE_SHA'][:7]}.zip"
          excluded = {'.git', '.gradle', 'build'}
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root)
                  if any(part in excluded for part in rel.parts):
                      continue
                  if p.name == 'local.properties' or p.suffix.lower() in {'.apk', '.aab', '.jks', '.keystore'}:
                      continue
                  z.write(p, rel.as_posix())
          PY
          unzip -t "$zip_name" >/dev/null
          zip_hash="$(sha256sum "$zip_name" | awk '{print $1}')"
          grep '^diff --git a/' .phase7-final.patch | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#' | sort -u > PHASE-7-CHANGED-FILES.txt
          cat > PHASE-7-REPORT.md <<EOF
          # PHASE-7-REPORT
          - Phase-6 formal handoff SHA: ${PHASE6_HANDOFF_SHA}
          - Phase-7 verified source SHA: ${SOURCE_SHA}
          - Branch: ${SOURCE_BRANCH}
          - Completed scope: dashboard UX/state hardening; Persian/RTL user-visible terminology; exact Persian Rial/percent formatting; responsive treasury controls; report localization and navigation fixes; bounded Room-backed scoped global search with typed targets and Persian/Arabic normalization; reusable paging for large result sets; A4 print hardening with fail-closed print/reprint audit; Daily Sales validation/persistence UX hardening.
          - DB schema changed: NO (remains 59)
          - Destructive migration fallback: NONE
          - Compile + AndroidTest compile: PASS
          - Room 59 schema verification: PASS
          - Targeted JVM UI/search/paging/format tests: PASS
          - Targeted API35 search/scope integration: PASS (${api35_tests} tests)
          - API35 result integrity / initialization guard: PASS
          - Phase-7 patch SHA-256: 4db68c04e22cf306e0b61c8b455869e150c2e29ec89e0d303dbdd4d6b95f6b55
          - Room 58 schema SHA-256: ${schema58_hash}
          - Room 59 schema SHA-256: ${schema59_hash}
          - Source artifact: ${zip_name}
          - Source artifact SHA-256: ${zip_hash}
          - Full heavy matrix: DEFERRED TO PHASE 8 BY POLICY
          - Known remaining Phase-7 blockers: NONE
          ## Changed files
          EOF
          sed 's/^/- /' PHASE-7-CHANGED-FILES.txt >> PHASE-7-REPORT.md
          cat > PHASE-7-EVIDENCE.txt <<EOF
          PHASE6_HANDOFF_SHA=${PHASE6_HANDOFF_SHA}
          VERIFIED_SOURCE_SHA=${SOURCE_SHA}
          HEAD_SHA=$(git rev-parse HEAD)
          BRANCH=${SOURCE_BRANCH}
          ROOM_VERSION=59
          DB_SCHEMA_CHANGED=NO
          PHASE7_PATCH_SHA256=4db68c04e22cf306e0b61c8b455869e150c2e29ec89e0d303dbdd4d6b95f6b55
          SCHEMA58_SHA256=${schema58_hash}
          SCHEMA59_SHA256=${schema59_hash}
          SOURCE_FILE=${zip_name}
          SOURCE_SHA256=${zip_hash}
          TARGETED_PHASE7=PASS
          TARGETED_JVM=PASS
          API35_SEARCH_SCOPE_INTEGRATION=PASS
          API35_RESULT_INTEGRITY=PASS
          API35_TEST_COUNT=${api35_tests}
          DESTRUCTIVE_MIGRATION_FALLBACK=NONE
          FULL_HEAVY_SUITES=DEFERRED_TO_PHASE8
          EOF

      - name: Upload Phase-7 handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase7-final-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          path: |
            PHASE-7-REPORT.md
            PHASE-7-EVIDENCE.txt
            PHASE-7-CHANGED-FILES.txt
            restaurant-management-remediation-phase7-source-*.zip
            phase7-source/app/schemas/ir.restaurant.management.data.db.AppDatabase/58.json
            phase7-source/app/schemas/ir.restaurant.management.data.db.AppDatabase/59.json
            phase7-source/app/build/outputs/androidTest-results/connected/**/TEST-*.xml
