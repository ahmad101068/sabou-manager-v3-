name: Package Sabou Fix19 Source

on:
  workflow_dispatch:
  push:
    branches: [dashboard-ux2-fix1-ci]
    paths:
      - '.github/workflows/dashboard-ux2-fix19-source-package.yml'

permissions:
  contents: read

env:
  SOURCE_ZIP: Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Reconstruct exact source through Fix19
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _project _out
          mkdir -p _project _out
          unzip -q "$SOURCE_ZIP" -d _project
          PROJECT_DIR="$(find _project -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/alpha1621_compilefix.patch"
          cat "$GITHUB_WORKSPACE"/_ci/personnel21.patch.gz.b64.* | base64 --decode --ignore-garbage | gzip -dc | patch --forward --batch -p1
          for p in personnel21-fix2.patch personnel21-fix3.patch personnel21-fix4.patch personnel21-fix5.patch; do
            patch --forward --batch -p1 < "$GITHUB_WORKSPACE/_ci/$p"
          done
          cat "$GITHUB_WORKSPACE"/_ci/dashboard-ux2-v2.patch.gz.b64.* | base64 --decode --ignore-garbage > "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -t "$RUNNER_TEMP/dashboard-ux2.patch.gz"
          gzip -dc "$RUNNER_TEMP/dashboard-ux2.patch.gz" | patch --forward --batch -p1
          for n in $(seq 1 19); do
            python3 "$GITHUB_WORKSPACE/_ci/apply-dashboard-ux2-fix${n}.py"
          done
          rm -rf .gradle .idea build app/build
          rm -f local.properties
          find . -type f \( -name '*.jks' -o -name '*.keystore' \) -delete
          cd ..
          zip -qr "$GITHUB_WORKSPACE/_out/Sabou-Fix19-SOURCE.zip" "$(basename "$PROJECT_DIR")"
          cd "$GITHUB_WORKSPACE/_out"
          sha256sum Sabou-Fix19-SOURCE.zip > Sabou-Fix19-SOURCE.sha256
          unzip -tq Sabou-Fix19-SOURCE.zip
      - name: Upload Fix19 source
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-Fix19-SOURCE-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            _out/Sabou-Fix19-SOURCE.zip
            _out/Sabou-Fix19-SOURCE.sha256
