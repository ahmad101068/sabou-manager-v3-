name: Resolve Android Lint Offline Cache

on:
  push:
    branches:
      - tools/offline-android-deps
    paths:
      - .github/workflows/resolve-lint-cache.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
      - name: Resolve lint-gradle 31.13.0 and transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/lint-cache-project"
          CACHE="$RUNNER_TEMP/lint-gradle-home"
          mkdir -p "$PROJECT" "$CACHE"
          cat > "$PROJECT/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'lint-cache'
          EOF
          cat > "$PROJECT/build.gradle" <<'EOF'
          configurations { lintOffline }
          dependencies { lintOffline 'com.android.tools.lint:lint-gradle:31.13.0' }
          tasks.register('resolveLint') {
            doLast {
              def files = configurations.lintOffline.resolve()
              println "RESOLVED_LINT_FILES=${files.size()}"
              files.each { println it }
            }
          }
          EOF
          cd "$PROJECT"
          GRADLE_USER_HOME="$CACHE" "$RUNNER_TEMP/gradle/gradle-8.13/bin/gradle" --no-daemon resolveLint
          GRADLE_USER_HOME="$CACHE" "$RUNNER_TEMP/gradle/gradle-8.13/bin/gradle" --offline --no-daemon resolveLint
          tar -C "$CACHE" -czf "$RUNNER_TEMP/lint-gradle-31.13.0-cache.tar.gz" .
          sha256sum "$RUNNER_TEMP/lint-gradle-31.13.0-cache.tar.gz" > "$RUNNER_TEMP/lint-gradle-31.13.0-cache.sha256"
      - name: Upload lint cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-gradle-31.13.0-offline-cache
          path: |
            ${{ runner.temp }}/lint-gradle-31.13.0-cache.tar.gz
            ${{ runner.temp }}/lint-gradle-31.13.0-cache.sha256
          compression-level: 0
          retention-days: 7
