name: Resolve Android Lint Offline Cache

on:
  push:
    branches:
      - tools/offline-android-deps
    paths:
      - .github/workflows/resolve-lint-cache.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
      - name: Ensure Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Resolve lint through a real AGP 8.13 Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/lint-cache-project"
          CACHE="$RUNNER_TEMP/lint-gradle-home"
          mkdir -p "$PROJECT/app/src/main" "$CACHE"
          cat > "$PROJECT/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "lint-cache"
          include(":app")
          EOF
          cat > "$PROJECT/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") version "8.13.0" apply false }
          EOF
          cat > "$PROJECT/app/build.gradle.kts" <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "offline.lintcache"
              compileSdk = 36
              defaultConfig { applicationId = "offline.lintcache"; minSdk = 23; targetSdk = 36; versionCode = 1; versionName = "1" }
          }
          EOF
          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="LintCache" /></manifest>
          EOF
          cd "$PROJECT"
          GRADLE_USER_HOME="$CACHE" "$RUNNER_TEMP/gradle/gradle-8.13/bin/gradle" --no-daemon lintDebug
          GRADLE_USER_HOME="$CACHE" "$RUNNER_TEMP/gradle/gradle-8.13/bin/gradle" --offline --no-daemon lintDebug
          tar -C "$CACHE" -czf "$RUNNER_TEMP/lint-gradle-31.13.0-cache.tar.gz" .
          sha256sum "$RUNNER_TEMP/lint-gradle-31.13.0-cache.tar.gz" > "$RUNNER_TEMP/lint-gradle-31.13.0-cache.sha256"
      - name: Upload lint cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-gradle-31.13.0-offline-cache
          path: |
            ${{ runner.temp }}/lint-gradle-31.13.0-cache.tar.gz
            ${{ runner.temp }}/lint-gradle-31.13.0-cache.sha256
          compression-level: 0
          retention-days: 7
