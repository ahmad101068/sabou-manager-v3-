name: Prepare Offline Android Dependencies

on:
  push:
    branches:
      - tools/offline-android-deps
    paths:
      - .github/workflows/prepare-offline-android-deps.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Build complete offline Android SDK and Gradle cache
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_VERSION: "8.13"
      AGP_VERSION: "8.13.0"
      KOTLIN_VERSION: "2.1.20"
      ANDROID_API: "36"
      BUILD_TOOLS_VERSION: "36.0.0"
      OFFLINE_GRADLE_HOME: ${{ github.workspace }}/offline-gradle-home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip" -d "$RUNNER_TEMP/gradle"
          "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Install Android SDK API 36 packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_SDK_ROOT/cmdline-tools"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

          test -f "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}/aapt2"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

      - name: Create dependency mirror project matching Phase 2
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/offline-phase2-deps"
          rm -rf "$OFFLINE_GRADLE_HOME" "$PROJECT"
          mkdir -p \
            "$OFFLINE_GRADLE_HOME" \
            "$PROJECT/app/src/main/java/offline/phase2" \
            "$PROJECT/app/src/test/java/offline/phase2" \
            "$PROJECT/app/src/androidTest/java/offline/phase2" \
            "$PROJECT/app/schemas"

          cat > "$PROJECT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > "$PROJECT/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "phase2-offline-dependency-mirror"
          include(":app")
          EOF

          cat > "$PROJECT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.13.0" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.20" apply false
              id("com.google.devtools.ksp") version "2.1.20-2.0.1" apply false
              id("androidx.room") version "2.8.4" apply false
          }
          EOF

          cat > "$PROJECT/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
              id("androidx.room")
          }

          android {
              namespace = "offline.phase2"
              compileSdk = 36
              defaultConfig {
                  applicationId = "offline.phase2"
                  minSdk = 23
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              testOptions { execution = "ANDROIDX_TEST_ORCHESTRATOR" }
          }

          room { schemaDirectory("$projectDir/schemas") }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.3")
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.11.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.4")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")
              implementation("androidx.navigation:navigation-compose:2.9.8")
              implementation(platform("androidx.compose:compose-bom:2026.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.room:room-runtime:2.8.4")
              implementation("androidx.room:room-ktx:2.8.4")
              implementation("androidx.work:work-runtime-ktx:2.11.2")
              implementation("androidx.datastore:datastore-preferences:1.2.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("net.zetetic:sqlcipher-android:4.17.0")
              implementation("androidx.sqlite:sqlite:2.6.2")
              ksp("androidx.room:room-compiler:2.8.4")

              testImplementation("junit:junit:4.13.2")
              testImplementation(kotlin("test"))
              androidTestImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test:core:1.6.1")
              androidTestImplementation("androidx.test.ext:junit:1.2.1")
              androidTestImplementation("androidx.sqlite:sqlite-framework:2.6.2")
              androidTestImplementation(platform("androidx.compose:compose-bom:2026.06.00"))
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
              androidTestUtil("androidx.test:orchestrator:1.6.1")
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
          }
          EOF

          cat > "$PROJECT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Phase2OfflineDeps" />
          </manifest>
          EOF

          cat > "$PROJECT/app/src/main/java/offline/phase2/OfflineDb.kt" <<'EOF'
          package offline.phase2

          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.room.Database
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          import androidx.room.RoomDatabase

          @Entity
          data class OfflineEntity(@PrimaryKey val id: Long)

          @Database(entities = [OfflineEntity::class], version = 1, exportSchema = true)
          abstract class OfflineDb : RoomDatabase()

          @Composable
          fun OfflineUi() { Text("offline") }
          EOF

          cat > "$PROJECT/app/src/test/java/offline/phase2/OfflineUnitTest.kt" <<'EOF'
          package offline.phase2

          import org.junit.Assert.assertTrue
          import org.junit.Test

          class OfflineUnitTest {
              @Test fun dependenciesResolve() { assertTrue(true) }
          }
          EOF

          cat > "$PROJECT/app/src/androidTest/java/offline/phase2/OfflineAndroidTest.kt" <<'EOF'
          package offline.phase2

          import androidx.test.ext.junit.runners.AndroidJUnit4
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class OfflineAndroidTest {
              @Test fun dependenciesResolve() { assertTrue(true) }
          }
          EOF

      - name: Resolve and verify complete dependency set online and offline
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/offline-phase2-deps"
          GRADLE="$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin/gradle"
          cd "$PROJECT"

          GRADLE_USER_HOME="$OFFLINE_GRADLE_HOME" "$GRADLE" --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest

          GRADLE_USER_HOME="$OFFLINE_GRADLE_HOME" "$GRADLE" --offline --no-daemon \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest

      - name: Package Android SDK subset
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/offline-artifacts"
          STAGE="$RUNNER_TEMP/android-sdk-api36-linux"
          rm -rf "$OUT" "$STAGE"
          mkdir -p "$OUT" "$STAGE/android-sdk/platforms" "$STAGE/android-sdk/build-tools"

          cp -a "$ANDROID_SDK_ROOT/platforms/android-${ANDROID_API}" "$STAGE/android-sdk/platforms/"
          cp -a "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS_VERSION}" "$STAGE/android-sdk/build-tools/"
          cp -a "$ANDROID_SDK_ROOT/platform-tools" "$STAGE/android-sdk/"
          if [ -d "$ANDROID_SDK_ROOT/licenses" ]; then cp -a "$ANDROID_SDK_ROOT/licenses" "$STAGE/android-sdk/"; fi

          cat > "$STAGE/README.txt" <<EOF
          Offline Android SDK subset for Phase 2 verification.
          API: ${ANDROID_API}
          Build Tools: ${BUILD_TOOLS_VERSION}
          Platform Tools: included
          EOF

          tar -C "$STAGE" -czf "$OUT/android-sdk-api36-linux.tar.gz" .
          sha256sum "$OUT/android-sdk-api36-linux.tar.gz" > "$OUT/android-sdk-api36-linux.sha256"

      - name: Package Gradle and complete project cache
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/offline-artifacts"
          STAGE="$RUNNER_TEMP/gradle-phase2-offline"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp -a "$OFFLINE_GRADLE_HOME" "$STAGE/gradle-user-home"
          cp -a "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}" "$STAGE/gradle-${GRADLE_VERSION}"

          cat > "$STAGE/README.txt" <<EOF
          Complete offline Gradle cache for the Phase 2 dependency set.
          Gradle: ${GRADLE_VERSION}
          AGP: ${AGP_VERSION}
          Kotlin: ${KOTLIN_VERSION}
          Verified by successful online and --offline assemble/unit-test/androidTest-assemble builds.
          EOF

          tar -C "$STAGE" -czf "$OUT/gradle-phase2-complete-offline.tar.gz" .
          sha256sum "$OUT/gradle-phase2-complete-offline.tar.gz" > "$OUT/gradle-phase2-complete-offline.sha256"

      - name: Upload Android SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-api36-linux
          path: |
            ${{ runner.temp }}/offline-artifacts/android-sdk-api36-linux.tar.gz
            ${{ runner.temp }}/offline-artifacts/android-sdk-api36-linux.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload complete Gradle cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-phase2-complete-offline
          path: |
            ${{ runner.temp }}/offline-artifacts/gradle-phase2-complete-offline.tar.gz
            ${{ runner.temp }}/offline-artifacts/gradle-phase2-complete-offline.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
