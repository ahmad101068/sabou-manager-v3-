name: Phase 8.1 API23 Blocker Isolation
on:
  push:
    branches: [diagnostic/phase8-1-api23-shards-v2]
permissions:
  contents: read
  actions: read
jobs:
  api23-blocker:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        test:
          - 'ir.restaurant.management.data.repository.InventoryLedgerIntegrationTest#stockAtAnotherLocationCannotMaskLocationShortage'
          - 'ir.restaurant.management.ui.DashboardNavigationSettingsUx2ComposeTest#cashierHome_filtersSensitiveKpisAndActionsBeforeRendering'
          - 'ir.restaurant.management.ui.DashboardNavigationSettingsUx2ComposeTest#inventoryHome_showsInventoryContext_withoutFinancialKpis'
          - 'ir.restaurant.management.ui.DashboardNavigationSettingsUx2ComposeTest#controlHub_exposesDedicatedManagementWorkflowRoutes'
          - 'ir.restaurant.management.ui.StartupAuthenticationBoundaryComposeTest#cashierWithoutPayrollPermission_logsInWithoutPayrollSubscription_andLogoutTearsDownProtectedGraph'
          - 'ir.restaurant.management.ui.StartupAuthenticationBoundaryComposeTest#ownerWithPayrollPermission_afterLoginCanLoadPayrollWorkspace'
          - 'ir.restaurant.management.ui.EnterpriseCoreComposeE2ETest#treasuryReversal_uiCreatesCompensatingJournalLedgerReferenceAndMarksOriginalReversed'
    env:
      SOURCE_SHA: cd15f49024f7e58c4b086d1256d12f2aa2438eec
      PHASE4_ARTIFACT_ID: '9443574109'
      PHASE5_ARTIFACT_ID: '9466675671'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Reconstruct exact Phase 8.1 release candidate
        run: bash .github/scripts/reconstruct-phase8-1-release-candidate.sh phase8-1-source
      - name: Recover authentic Room 56 57 58 schemas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/recover-phase8-1-schemas.sh phase8-1-source
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.13'
      - name: Compile blocker instrumentation
        working-directory: phase8-1-source
        run: gradle --no-daemon --console=plain :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API23 isolated blocker
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 768M
          disable-animations: false
          script: >-
            adb wait-for-device &&
            until adb shell pm path android >/dev/null 2>&1; do sleep 2; done &&
            cd "$GITHUB_WORKSPACE/phase8-1-source" &&
            gradle --no-daemon --no-build-cache :app:connectedDebugAndroidTest
            "-Pandroid.testInstrumentationRunnerArguments.class=${{ matrix.test }}"
