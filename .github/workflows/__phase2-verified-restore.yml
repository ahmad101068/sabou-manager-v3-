name: Temporary verified Phase2 restore

on:
  push:
    branches:
      - release/v1.0.0

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
          fetch-depth: 0
      - name: Restore exact verified assertions
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/androidTest/java/ir/restaurant/management/data/repository/Phase2CorrectionIntegrationTest.kt')
          text = path.read_text()
          replacements = [
              (
                  '        postBranchPayroll(branchId = 1L, baseSalaryRial = 9_000_000L)',
                  '        val postedPayrollRial = postBranchPayroll(branchId = 1L, baseSalaryRial = 9_000_000L)',
              ),
              (
                  '        assertEquals(9_000_000L, brief.profitability.payrollRial)',
                  '        assertEquals(postedPayrollRial, brief.profitability.payrollRial)',
              ),
              (
                  '        assertEquals(56_000_000L, brief.profitability.estimatedOperatingProfitRial)',
                  '        assertEquals(77_000_000L - 12_000_000L - postedPayrollRial, brief.profitability.estimatedOperatingProfitRial)',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          Path('.github/workflows/__phase2-verified-restore.yml').unlink()
      - name: Commit exact source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/androidTest/java/ir/restaurant/management/data/repository/Phase2CorrectionIntegrationTest.kt .github/workflows/__phase2-verified-restore.yml
          git diff --cached --check
          git commit -m 'fix(test): restore verified phase2 payroll assertion'
          git push origin HEAD:release/v1.0.0
