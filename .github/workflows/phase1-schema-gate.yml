name: Phase 1 Android Build Tools 35 Bootstrap

on:
  push:
    branches: [phase1-schema-gate]
    paths:
      - ".github/workflows/phase1-schema-gate.yml"

permissions:
  contents: read

jobs:
  sdk-part:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Stage required Android Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p _sdk35/build-tools
          cp -a "$ANDROID_HOME/build-tools/35.0.0" _sdk35/build-tools/
          du -sh _sdk35/build-tools/35.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-android-build-tools-35
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
          path: _sdk35/build-tools/
