name: Phase 1 Room Schema Toolchain Bootstrap

on:
  push:
    branches: [phase1-schema-gate]
    paths:
      - ".github/workflows/phase1-schema-gate.yml"

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Warm Android and Room build dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _toolchain_project
          mkdir _toolchain_project
          unzip -q "Sabou-Final-ERP-SOURCE-buildfix1.zip" -d _toolchain_project
          PROJECT_DIR="$(find _toolchain_project -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain

      - name: Stage portable build toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _phase1_toolchain/gradle _phase1_toolchain/android-sdk
          cp -a "$HOME/.gradle/wrapper" _phase1_toolchain/gradle/
          cp -a "$HOME/.gradle/caches" _phase1_toolchain/gradle/
          cp -a "$ANDROID_HOME/platforms/android-36" _phase1_toolchain/android-sdk/
          cp -a "$ANDROID_HOME/build-tools" _phase1_toolchain/android-sdk/
          cp -a "$ANDROID_HOME/licenses" _phase1_toolchain/android-sdk/ || true
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME" > _phase1_toolchain/manifest.txt
          du -sh _phase1_toolchain/*

      - uses: actions/upload-artifact@v4
        with:
          name: phase1-room-build-toolchain
          if-no-files-found: error
          compression-level: 6
          retention-days: 2
          path: _phase1_toolchain/
