name: Phase 1 Room Schema Gate

on:
  push:
    branches: [phase1-schema-gate]
    paths:
      - "Sabou-Final-ERP-SOURCE-buildfix1.zip"
      - ".github/workflows/phase1-schema-gate.yml"

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _schema_project
          mkdir _schema_project
          unzip -q "Sabou-Final-ERP-SOURCE-buildfix1.zip" -d _schema_project
          PROJECT_DIR="$(find _schema_project -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n1)"
          test -n "$PROJECT_DIR"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
      - name: Generate Room schema
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain --stacktrace
          test -f app/schemas/ir.restaurant.management.data.db.AppDatabase/49.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase1-room-schema-49
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.PROJECT_DIR }}/app/schemas/ir.restaurant.management.data.db.AppDatabase/49.json
