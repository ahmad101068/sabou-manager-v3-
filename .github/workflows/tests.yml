name: Phase 3 Part 3B Runtime and Business Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase3-part3b-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  jvm-business-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract exact Part 3B candidate
        run: |
          set -euo pipefail
          cat phase3-ci-v2-parts/part-* > phase3-part3b-ci-source.zip
          mkdir phase3-source
          unzip -q phase3-part3b-ci-source.zip -d phase3-source
          git -C phase3-source apply "$GITHUB_WORKSPACE/phase3-junit-lifecycle.patch"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: JVM unit, business, performance, and instrumentation compile
        working-directory: phase3-source
        run: gradle --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
      - name: Summarize JVM JUnit evidence
        working-directory: phase3-source
        run: python3 scripts/summarize-test-results.py app/build/test-results/testDebugUnitTest --label JVM
      - name: Upload JVM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-jvm-tests-${{ github.sha }}
          path: |
            phase3-source/app/build/test-results/testDebugUnitTest/**
            phase3-source/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 14

  connected-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract exact Part 3B candidate
        run: |
          set -euo pipefail
          cat phase3-ci-v2-parts/part-* > phase3-part3b-ci-source.zip
          mkdir phase3-source
          unzip -q phase3-part3b-ci-source.zip -d phase3-source
          git -C phase3-source apply "$GITHUB_WORKSPACE/phase3-junit-lifecycle.patch"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Connected instrumentation and migration suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: cd "$GITHUB_WORKSPACE/phase3-source" && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Summarize connected JUnit evidence
        working-directory: phase3-source
        run: python3 scripts/summarize-test-results.py app/build/outputs/androidTest-results/connected --label CONNECTED_API_${{ matrix.api-level }}
      - name: Upload connected evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-connected-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            phase3-source/app/build/outputs/androidTest-results/connected/**
            phase3-source/app/build/reports/androidTests/connected/**
          if-no-files-found: error
          retention-days: 14

  connected-16kb:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract exact Part 3B candidate
        run: |
          set -euo pipefail
          cat phase3-ci-v2-parts/part-* > phase3-part3b-ci-source.zip
          mkdir phase3-source
          unzip -q phase3-part3b-ci-source.zip -d phase3-source
          git -C phase3-source apply "$GITHUB_WORKSPACE/phase3-junit-lifecycle.patch"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Connected 16KB runtime suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: page_size="$(adb shell getconf PAGE_SIZE | tr -d '\r')" && echo "RUNTIME_PAGE_SIZE=$page_size" && test "$page_size" = "16384" && cd "$GITHUB_WORKSPACE/phase3-source" && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Summarize 16KB connected JUnit evidence
        working-directory: phase3-source
        run: python3 scripts/summarize-test-results.py app/build/outputs/androidTest-results/connected --label CONNECTED_16KB
      - name: Upload 16KB runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-connected-16kb-${{ github.sha }}
          path: |
            phase3-source/app/build/outputs/androidTest-results/connected/**
            phase3-source/app/build/reports/androidTests/connected/**
          if-no-files-found: error
          retention-days: 14
