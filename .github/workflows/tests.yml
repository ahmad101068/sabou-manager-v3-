name: Phase 3 Part 3B Runtime and Business Tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase3-part3b-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  post-ci-uat-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract exact Part 3B candidate
        run: bash .github/scripts/reconstruct-part3b-candidate.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Targeted JVM UAT contracts
        working-directory: phase3-source
        run: gradle --no-daemon :app:testDebugUnitTest --tests ir.restaurant.management.ui.PostCiUatCorrectionContractTest
      - name: Compile targeted connected UAT suite
        working-directory: phase3-source
        run: gradle --no-daemon :app:compileDebugAndroidTestKotlin
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Targeted post-CI UAT regression on API 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: >-
            cd "$GITHUB_WORKSPACE/phase3-source" &&
            gradle --no-daemon --no-build-cache :app:connectedDebugAndroidTest
            "-Pandroid.testInstrumentationRunnerArguments.class=ir.restaurant.management.ui.PostCiUatCorrectionComposeTest,ir.restaurant.management.data.repository.BranchPurchasePostingIntegrationTest#blankInternalInvoiceNumber_isAllocatedUniquelyAndPersisted,ir.restaurant.management.ui.DashboardNavigationSettingsUx2ComposeTest#homeRequiresExplicitBranchBeforeCanonicalManagementKpis"
      - name: Summarize targeted UAT evidence
        working-directory: phase3-source
        run: python3 scripts/summarize-test-results.py app/build/outputs/androidTest-results/connected --label POST_CI_UAT_TARGETED
      - name: Upload targeted UAT evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-ci-uat-targeted-${{ github.sha }}
          path: |
            phase3-source/app/build/test-results/testDebugUnitTest/**
            phase3-source/app/build/reports/tests/testDebugUnitTest/**
            phase3-source/app/build/outputs/androidTest-results/connected/**
            phase3-source/app/build/reports/androidTests/connected/**
          if-no-files-found: error
          retention-days: 14

  jvm-business-tests:
    needs: post-ci-uat-targeted
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract exact Part 3B candidate
        run: bash .github/scripts/reconstruct-part3b-candidate.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: JVM unit, business, performance, and instrumentation compile
        working-directory: phase3-source
        run: gradle --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
      - name: Summarize JVM JUnit evidence
        working-directory: phase3-source
        run: python3 scripts/summarize-test-results.py app/build/test-results/testDebugUnitTest --label JVM
      - name: Upload JVM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-jvm-tests-${{ github.sha }}
          path: |
            phase3-source/app/build/test-results/testDebugUnitTest/**
            phase3-source/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: error
          retention-days: 14

  connected-tests:
    needs: jvm-business-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api-level: [23, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract exact Part 3B candidate
        run: bash .github/scripts/reconstruct-part3b-candidate.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Clean connected candidate outputs
        working-directory: phase3-source
        run: gradle --no-daemon clean
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Connected instrumentation and migration suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: cd "$GITHUB_WORKSPACE/phase3-source" && gradle --no-daemon --no-build-cache :app:connectedDebugAndroidTest
      - name: Summarize connected JUnit evidence
        working-directory: phase3-source
        run: python3 scripts/summarize-test-results.py app/build/outputs/androidTest-results/connected --label CONNECTED_API_${{ matrix.api-level }}
      - name: Upload connected evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-connected-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            phase3-source/app/build/outputs/androidTest-results/connected/**
            phase3-source/app/build/reports/androidTests/connected/**
          if-no-files-found: error
          retention-days: 14

  connected-16kb:
    needs: connected-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract exact Part 3B candidate
        run: bash .github/scripts/reconstruct-part3b-candidate.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Clean 16KB candidate outputs
        working-directory: phase3-source
        run: gradle --no-daemon clean
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Connected 16KB runtime suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run-connected-16kb.sh"
      - name: Summarize 16KB connected JUnit evidence
        working-directory: phase3-source
        run: python3 scripts/summarize-test-results.py app/build/outputs/androidTest-results/connected --label CONNECTED_16KB
      - name: Upload 16KB runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-connected-16kb-${{ github.sha }}
          path: |
            phase3-source/app/build/outputs/androidTest-results/connected/**
            phase3-source/app/build/reports/androidTests/connected/**
            phase3-source/app/build/evidence/**
          if-no-files-found: error
          retention-days: 14
