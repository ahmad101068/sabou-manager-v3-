name: Temporary release auth dashboard diagnostic

on:
  push:
    branches:
      - release/v1.0.0

permissions:
  contents: read

jobs:
  diagnostic-api35:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=ir.restaurant.management.ui.DashboardNavigationSettingsUx2ComposeTest,ir.restaurant.management.ui.StartupAuthenticationBoundaryComposeTest
            status=$?
            echo '===== CONNECTED TEST XML ====='
            find app/build/outputs/androidTest-results -type f -name '*.xml' -print -exec cat {} \; || true
            exit $status
