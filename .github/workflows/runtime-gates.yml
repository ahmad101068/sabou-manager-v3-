name: Sabou Android CI

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Optional exact source ZIP filename; blank selects the highest Alpha version"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "Sabou-Restaurant-ERP-Alpha*.zip"
      - ".github/workflows/runtime-gates.yml"
      - ".github/scripts/prepare-sabou-source.sh"
  pull_request:
    branches:
      - main
    paths:
      - "Sabou-Restaurant-ERP-Alpha*.zip"
      - ".github/workflows/runtime-gates.yml"
      - ".github/scripts/prepare-sabou-source.sh"

permissions:
  contents: read

concurrency:
  group: sabou-android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SABOU_SOURCE_ZIP: ${{ github.event.inputs.source_zip || '' }}

jobs:
  host-gates:
    name: Host gates — static, compile, unit, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CI evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci/logs
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee _ci/logs/00-run-context.log

      - name: Resolve and extract source ZIP
        shell: bash
        run: bash .github/scripts/prepare-sabou-source.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Alpha161 static and migration verifiers
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cd "$PROJECT_DIR"
          {
            bash scripts/verify-foundation.sh
            bash scripts/verify-alpha161-professional-erp.sh
            python3 scripts/verify-alpha161-sql.py
            python3 scripts/verify-alpha161-ci-logfix.py
            python3 scripts/verify-hr-payroll-migration.py
            python3 scripts/verify-runtime-crash-repair.py
          } 2>&1 | tee "$GITHUB_WORKSPACE/_ci/logs/02-static-verification.log"

      - name: Compile debug Kotlin
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileDebugKotlin --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/_ci/logs/03-compileDebugKotlin.log"

      - name: Run debug unit tests
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain testDebugUnitTest --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/_ci/logs/04-testDebugUnitTest.log"

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain lintDebug --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/_ci/logs/05-lintDebug.log"

      - name: Assemble debug, instrumentation, and release artifacts
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain \
            assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/_ci/logs/06-assemble.log"

      - name: Upload host CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-host-gates-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            _ci/logs/
            _ci/project/**/app/build/outputs/apk/debug/*.apk
            _ci/project/**/app/build/outputs/apk/androidTest/debug/*.apk
            _ci/project/**/app/build/outputs/apk/release/*.apk
            _ci/project/**/app/build/reports/
            _ci/project/**/app/build/test-results/
            _ci/project/**/app/schemas/

  instrumentation:
    name: Instrumentation — API ${{ matrix.api_level }}
    needs: host-gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api_level: 23
            profile: "Nexus 6"
          - api_level: 35
            profile: "pixel_5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize instrumentation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci/logs
          echo "api_level=${{ matrix.api_level }}" | tee _ci/logs/00-instrumentation-context.log

      - name: Resolve and extract source ZIP
        shell: bash
        run: bash .github/scripts/prepare-sabou-source.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run full instrumentation suite on API ${{ matrix.api_level }}
        uses: reactivecircus/android-emulator-runner@v2.30.1
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: |
            set -o pipefail
            cd "$PROJECT_DIR"
            ./gradlew --no-daemon --console=plain connectedDebugAndroidTest --stacktrace \
              2>&1 | tee "$GITHUB_WORKSPACE/_ci/logs/10-connectedDebugAndroidTest-api${{ matrix.api_level }}.log"

      - name: Upload API ${{ matrix.api_level }} instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-instrumentation-api${{ matrix.api_level }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            _ci/logs/
            _ci/project/**/app/build/reports/androidTests/
            _ci/project/**/app/build/outputs/androidTest-results/
            _ci/project/**/app/build/outputs/managed_device_android_test_additional_output/
