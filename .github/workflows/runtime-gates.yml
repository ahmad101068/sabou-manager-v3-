name: Sabou Android Runtime Gates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/runtime-gates.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.zip"
      - ".github/workflows/runtime-gates.yml"

permissions:
  contents: read

concurrency:
  group: sabou-runtime-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, unit and emulator gates
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize durable CI evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ci/logs
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee _ci/logs/00-run-context.log

      - name: Resolve and extract the source ZIP
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -euo pipefail
            mapfile -t source_zips < <(
              find . -maxdepth 1 -type f \
                -name 'Sabou-Restaurant-ERP-Alpha*.zip' \
                -print | sort
            )

            if [[ ${#source_zips[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one Sabou source ZIP in the repository root; found ${#source_zips[@]}."
              printf '%s\n' "${source_zips[@]}"
              exit 1
            fi

            mkdir -p _ci/project
            unzip -q "${source_zips[0]}" -d _ci/project

            mapfile -t wrappers < <(
              find _ci/project -type f -name gradlew -print | sort
            )
            if [[ ${#wrappers[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one Gradle wrapper after extraction; found ${#wrappers[@]}."
              printf '%s\n' "${wrappers[@]}"
              exit 1
            fi

            project_dir="$(cd "${wrappers[0]%/gradlew}" && pwd)"
            test -f "${project_dir}/settings.gradle.kts" || {
              echo "::error::settings.gradle.kts was not found beside gradlew."
              exit 1
            }
            test -d "${project_dir}/app" || {
              echo "::error::Android app module was not found."
              exit 1
            }

            chmod +x "${project_dir}/gradlew"
            echo "PROJECT_DIR=${project_dir}" >> "$GITHUB_ENV"
            echo "SOURCE_ZIP=${source_zips[0]}" >> "$GITHUB_ENV"
            sha256sum "${source_zips[0]}"
          ) 2>&1 | tee _ci/logs/01-resolve-source.log
          rc=${PIPESTATUS[0]}
          echo "resolve_source=${rc}" >> _ci/logs/exit-codes.env
          exit "${rc}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run clean compile unit assemble and lint gates
        shell: bash
        run: |
          set +e
          set -o pipefail
          cd "$PROJECT_DIR"
          gates=(
            clean
            compileDebugKotlin
            testDebugUnitTest
            assembleDebug
            lintDebug
          )
          overall_rc=0
          index=0
          for gate in "${gates[@]}"; do
            index=$((index + 1))
            log_file="$GITHUB_WORKSPACE/_ci/logs/host-$(printf '%02d' "$index")-${gate}.log"
            echo "Running ./gradlew ${gate}" | tee "$log_file"
            ./gradlew --no-daemon "$gate" --stacktrace 2>&1 | tee -a "$log_file"
            rc=${PIPESTATUS[0]}
            echo "${gate}=${rc}" | tee -a "$log_file" "$GITHUB_WORKSPACE/_ci/logs/exit-codes.env"
            if [[ $rc -ne 0 ]]; then
              overall_rc=1
            fi
          done
          exit "$overall_rc"

      - name: Enable KVM
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -euo pipefail
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          ) 2>&1 | tee _ci/logs/03-enable-kvm.log
          rc=${PIPESTATUS[0]}
          echo "enable_kvm=${rc}" >> _ci/logs/exit-codes.env
          exit "${rc}"

      - name: Run target regressions and full instrumentation suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          script: |
            set +e
            set -uo pipefail
            log_dir="$GITHUB_WORKSPACE/_ci/logs"
            mkdir -p "$log_dir"
            cd "$PROJECT_DIR"

            targets=(
              'ir.sabou.inventory.data.db.FinancialClosuresMigration34To35Test#addsPayrollRevisionsAndGuardsClosedSalesDays'
              'ir.sabou.inventory.data.repository.AssetOutboxIntegrationTest#successfulDisposalCommitsAssetAndVersionedOutboxTogether'
              'ir.sabou.inventory.data.repository.DailySalesReversalIntegrationTest'
              'ir.sabou.inventory.data.repository.ManagementControlTransactionIntegrationTest'
              'ir.sabou.inventory.data.repository.RecipeVersionIntegrationTest'
              'ir.sabou.inventory.data.repository.InventoryTransferWorkflowIntegrationTest#issueAndReceiptTrackInTransitPreserveValueAndCreateNoJournal'
              'ir.sabou.inventory.data.repository.InventoryTransferWorkflowIntegrationTest#quantityVarianceAndUnauthorizedReceiptCannotMutateDestination'
              'ir.sabou.inventory.data.repository.InventoryTransferWorkflowIntegrationTest#immediateCompatibilityFlowIsAtomicAndReplaySafe'
              'ir.sabou.inventory.data.repository.InventoryTransferWorkflowIntegrationTest#outboxFailureRollsBackIssueMovementLotProjectionAuditAndStatus'
              'ir.sabou.inventory.data.repository.InventoryWasteWorkflowIntegrationTest#expiredLotWasteUsesExactLotCostAndPostsAllEffectsAtomically'
            )

            overall_rc=0
            index=0
            for target in "${targets[@]}"; do
              index=$((index + 1))
              safe_name="$(printf '%s' "$target" | tr '#.' '__')"
              log_file="${log_dir}/target-$(printf '%02d' "$index")-${safe_name}.log"
              echo "Running target ${index}/${#targets[@]}: ${target}" | tee "$log_file"
              ./gradlew --no-daemon connectedDebugAndroidTest \
                "-Pandroid.testInstrumentationRunnerArguments.class=${target}" \
                --stacktrace 2>&1 | tee -a "$log_file"
              rc=${PIPESTATUS[0]}
              echo "target_${index}=${rc}" | tee -a "$log_file" "$log_dir/exit-codes.env"
              if [[ $rc -ne 0 ]]; then
                overall_rc=1
              fi
            done

            ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace \
              2>&1 | tee "$log_dir/20-connectedDebugAndroidTest-full.log"
            full_rc=${PIPESTATUS[0]}
            echo "connected_full=${full_rc}" | tee -a "$log_dir/exit-codes.env"
            if [[ $full_rc -ne 0 ]]; then
              overall_rc=1
            fi
            exit "$overall_rc"

      - name: Collect final evidence summary
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p _ci/logs
          {
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo
            echo "Recorded exit codes:"
            if [[ -f _ci/logs/exit-codes.env ]]; then
              cat _ci/logs/exit-codes.env
            else
              echo "No gate exit code was recorded; inspect the GitHub step log."
            fi
            echo
            echo "Collected files:"
            find _ci/logs -maxdepth 1 -type f -printf '%f\n' | sort
          } | tee _ci/logs/99-final-summary.log
          cp "$GITHUB_EVENT_PATH" _ci/logs/github-event.json

      - name: Upload raw CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-raw-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: _ci/logs/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK and generated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sabou-build-and-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            _ci/project/**/app/build/outputs/apk/debug/*.apk
            _ci/project/**/app/build/reports/
            _ci/project/**/app/build/test-results/
            _ci/project/**/app/build/outputs/androidTest-results/
