name: Phase 8.1 Targeted Verification

on:
  push:
    branches: [remediation/phase8-1-final-production-closure]
  pull_request:
    branches: [remediation/phase8-final-verification-20260823]

permissions:
  contents: read

concurrency:
  group: phase8-1-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Reconstruct Phase 8.1 candidate
        run: bash .github/scripts/reconstruct-phase8-1-candidate.sh phase8-1-source
      - name: Archive exact reconstructed candidate
        run: |
          zip -qr "phase8-1-candidate-${SOURCE_SHA}.zip" phase8-1-source
          sha256sum "phase8-1-candidate-${SOURCE_SHA}.zip" > phase8-1-candidate-sha256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase8-1-candidate-${{ env.SOURCE_SHA }}
          path: |
            phase8-1-candidate-${{ env.SOURCE_SHA }}.zip
            phase8-1-candidate-sha256.txt
          if-no-files-found: error
          retention-days: 14

  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Reconstruct Phase 8.1 candidate
        run: bash .github/scripts/reconstruct-phase8-1-candidate.sh phase8-1-source
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.13'
      - name: Compile production and instrumentation source
        working-directory: phase8-1-source
        run: gradle --no-daemon --console=plain :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin
      - name: JVM regression suite
        working-directory: phase8-1-source
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest
      - name: Lint debug
        working-directory: phase8-1-source
        run: gradle --no-daemon --console=plain :app:lintDebug
      - name: Assemble debug + androidTest
        working-directory: phase8-1-source
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
