name: Temporary restore verified Phase 8.1 instrumentation tests

on:
  push:
    branches: [release/v1.0.0]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
          fetch-depth: 0
      - name: Restore exact verified tests and self-remove
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          outer="$RUNNER_TEMP/phase81-final.zip"
          source_zip="$RUNNER_TEMP/phase81-source.zip"
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9671596355/zip" \
            -o "$outer"
          echo 'c715ff988a40f4efeed6b5e8fd6fd5a421fb78e479b76145058081942b5713b8  '"$outer" | sha256sum -c -
          unzip -p "$outer" restaurant-management-production-final-source-5d9f1bd.zip > "$source_zip"
          echo '5e1d8f862bbc06cee54507f145f12adc4e325af804c6a8662ea0f27f0c2ec373  '"$source_zip" | sha256sum -c -

          restore() {
            local path="$1" expected="$2"
            mkdir -p "$(dirname "$path")"
            unzip -p "$source_zip" "$path" > "$path"
            echo "$expected  $path" | sha256sum -c -
          }

          restore app/src/androidTest/java/ir/restaurant/management/data/db/Phase81RecentMigrationMatrixTest.kt 0a88f127bc20256df5ccb05dce3c6e0c45f5f49094b11b6456a0f755cbde67a8
          restore app/src/androidTest/java/ir/restaurant/management/data/repository/Phase81AuditIntegrityIntegrationTest.kt 919ce761d439ddf0a8197077ff6f5cb8a118313709fc716883cb74ada2d596a6
          restore app/src/androidTest/java/ir/restaurant/management/data/repository/Phase81LargeDataPerformanceIntegrationTest.kt d99a149c624e1c678b50efe6cbd554c192a765752a7566b39f15e1ec835b6078
          restore app/src/androidTest/java/ir/restaurant/management/data/repository/Phase81UserOptimisticConcurrencyIntegrationTest.kt 25a8f1cf66e22543a2c67ad9134f8ab35e6fa28d4ef6c09e232c7580ede8c0b6
          restore app/src/androidTest/java/ir/restaurant/management/data/security/Phase81ForensicIntegrityLedgerIntegrationTest.kt 4838dd0c5ba1d9ab03f515987f71c3e0280d9ca2eeaec184872005313e9a575b

          rm .github/workflows/__restore-phase81-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/androidTest/java .github/workflows/__restore-phase81-tests.yml
          git diff --cached --quiet && exit 0
          git commit -m 'test(release): restore verified Phase 8.1 instrumentation coverage'
          git push origin HEAD:release/v1.0.0
