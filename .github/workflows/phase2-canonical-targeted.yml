name: Phase 2 Canonical Financial Targeted Verification

on:
  push:
    branches: [remediation/financial-truth]
    paths:
      - 'phase2-remediation/**'
      - '.github/scripts/reconstruct-phase2-canonical.sh'
      - '.github/workflows/phase2-canonical-targeted.yml'
      - '.github/workflows/phase2-source-handoff.yml'
  pull_request:
    branches: [remediation/canonical-hardening]

permissions:
  contents: read

concurrency:
  group: phase2-canonical-financial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reconstruct exact Phase 2 candidate
        run: bash .github/scripts/reconstruct-phase2-canonical.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Compile Phase 2 source and targeted instrumentation
        working-directory: phase3-source
        run: gradle --no-daemon --console=plain :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin
      - name: Targeted JVM financial contracts
        working-directory: phase3-source
        run: >-
          gradle --no-daemon --console=plain :app:testDebugUnitTest
          --tests 'ir.restaurant.management.phase2.*'
          --tests 'ir.restaurant.management.ui.Phase2DashboardModelsTest'
          --tests 'ir.restaurant.management.domain.purchase.PurchaseManagementTest'
          --tests 'ir.restaurant.management.domain.treasury.TreasuryModelsTest'
      - name: Verify Room 55 and source hygiene
        working-directory: phase3-source
        run: |
          set -euo pipefail
          grep -Fq 'internal const val APP_DATABASE_SCHEMA_VERSION = 55' app/src/main/java/ir/restaurant/management/data/db/AppDatabase.kt
          test -s app/schemas/ir.restaurant.management.data.db.AppDatabase/55.json
          test ! -e app/schemas/ir.restaurant.management.data.db.AppDatabase/56.json
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Targeted financial integration API 35
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: >-
            cd "$GITHUB_WORKSPACE/phase3-source" &&
            gradle --no-daemon --no-build-cache :app:connectedDebugAndroidTest
            "-Pandroid.testInstrumentationRunnerArguments.class=ir.restaurant.management.data.repository.TreasuryV2IntegrationTest,ir.restaurant.management.data.repository.Phase2CorrectionIntegrationTest,ir.restaurant.management.data.repository.CrmReceivablesIntegrationTest,ir.restaurant.management.data.repository.DashboardBranchFilteringIntegrationTest,ir.restaurant.management.data.repository.DashboardBranchRenameCompatibilityIntegrationTest,ir.restaurant.management.data.repository.BranchPurchasePostingIntegrationTest,ir.restaurant.management.data.repository.AssetLifecycleIntegrationTest,ir.restaurant.management.data.repository.EnterprisePermissionIntegrationTest"
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase2-canonical-financial-${{ github.sha }}
          path: |
            phase3-source/app/build/test-results/testDebugUnitTest/**
            phase3-source/app/build/reports/tests/testDebugUnitTest/**
            phase3-source/app/build/outputs/androidTest-results/connected/**
            phase3-source/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
