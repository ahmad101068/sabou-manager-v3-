name: Phase 5 Targeted Verification

on:
  push:
    branches:
      - remediation/phase5-recipe-assets-20260821
  pull_request:
    branches:
      - remediation/phase4-hr-payroll-20260821

permissions:
  contents: read

concurrency:
  group: phase5-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PHASE4_BASELINE_SHA: 8f01f91fd025fe2935360976b455680787caa277
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Reconstruct Phase-5 candidate
        run: bash .github/scripts/reconstruct-phase5-candidate.sh phase5-source
      - name: Diagnose Phase-5 API35 fixture collisions
        run: |
          set -euo pipefail
          echo '=== Migration57To58Test ==='
          nl -ba phase5-source/app/src/androidTest/java/ir/restaurant/management/data/db/Migration57To58Test.kt | sed -n '1,120p'
          echo '=== AssetLifecycleIntegrationTest setup ==='
          nl -ba phase5-source/app/src/androidTest/java/ir/restaurant/management/data/repository/AssetLifecycleIntegrationTest.kt | sed -n '1,95p'
          echo '=== DailySalesReversalIntegrationTest setup ==='
          nl -ba phase5-source/app/src/androidTest/java/ir/restaurant/management/data/repository/DailySalesReversalIntegrationTest.kt | sed -n '1,75p'
          echo '::error::fixture diagnostic captured; apply exact Phase-5 hotfix-02 before full gate'
          exit 1
