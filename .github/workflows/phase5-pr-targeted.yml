name: Phase 5 Targeted Verification

on:
  push:
    branches:
      - remediation/phase5-recipe-assets-20260821
  pull_request:
    branches:
      - remediation/phase4-hr-payroll-20260821

permissions:
  contents: read

concurrency:
  group: phase5-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PHASE4_BASELINE_SHA: 8f01f91fd025fe2935360976b455680787caa277
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Reconstruct Phase-5 candidate
        run: bash .github/scripts/reconstruct-phase5-candidate.sh phase5-source
      - name: Diagnose exact Phase-5 fixture references
        run: |
          set -euo pipefail
          migration=phase5-source/app/src/androidTest/java/ir/restaurant/management/data/db/Migration57To58Test.kt
          asset=phase5-source/app/src/androidTest/java/ir/restaurant/management/data/repository/AssetLifecycleIntegrationTest.kt
          sales=phase5-source/app/src/androidTest/java/ir/restaurant/management/data/repository/DailySalesReversalIntegrationTest.kt
          echo '=== Migration inventory fixture ==='
          grep -n -E 'inventory_items|VALUES\(10|VALUES\(11|sku' "$migration" || true
          echo '=== Asset branch references ==='
          grep -n -E 'BranchEntity|branchId|toBranchId|branch =|toBranch =' "$asset" || true
          echo '=== Asset helper tail ==='
          nl -ba "$asset" | tail -n 110
          echo '=== Daily Sales branch references ==='
          grep -n -E 'BranchEntity|branchId|locationId|DailySalesDraft|LocalDailySalesRepository' "$sales" || true
          echo '=== Daily Sales helper tail ==='
          nl -ba "$sales" | tail -n 100
          echo '::error::exact fixture diagnostic captured; apply deterministic Phase-5 hotfix-02'
          exit 1
