name: Phase 5 Targeted Verification

on:
  push:
    branches:
      - remediation/phase5-recipe-assets-20260821
  pull_request:
    branches:
      - remediation/phase4-hr-payroll-20260821

permissions:
  contents: read

concurrency:
  group: phase5-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PHASE4_BASELINE_SHA: 8f01f91fd025fe2935360976b455680787caa277
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Reconstruct Phase-5 candidate
        run: bash .github/scripts/reconstruct-phase5-candidate.sh phase5-source
      - name: Diagnose final Daily Sales scope fixture
        run: |
          set -euo pipefail
          sales=phase5-source/app/src/androidTest/java/ir/restaurant/management/data/repository/DailySalesReversalIntegrationTest.kt
          repo=phase5-source/app/src/main/java/ir/restaurant/management/data/repository/LocalDailySalesRepository.kt
          echo '=== DailySales lines 35-125 ==='
          nl -ba "$sales" | sed -n '35,125p'
          echo '=== DailySales branch/location refs ==='
          grep -n -E 'branchId|locationId|defaultLocationId|BranchEntity|InventoryLocation|LocationEntity|managementControlDao' "$sales" || true
          echo '=== prepare guard vicinity ==='
          line=$(grep -n 'تاریخ، شعبه و مکان مصرف فروش معتبر نیست' "$repo" | head -1 | cut -d: -f1)
          start=$((line-35)); [ "$start" -lt 1 ] && start=1
          end=$((line+25))
          nl -ba "$repo" | sed -n "${start},${end}p"
          echo '=== defaultLocationId implementation ==='
          grep -R -n -B8 -A12 'defaultLocationId' phase5-source/app/src/main/java/ir/restaurant/management/data/db phase5-source/app/src/main/java/ir/restaurant/management/data/repository || true
          echo '::error::final Daily Sales scope diagnostic captured; apply Phase-5 hotfix-03 and restore full gate'
          exit 1
