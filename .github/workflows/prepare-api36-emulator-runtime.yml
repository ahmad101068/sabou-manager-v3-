      - name: Upload part 08
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api36-emulator-runtime-part08
          path: ${{ runner.temp }}/api36-out/api36-emulator-runtime.tar.gz.part08
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload part 09
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
