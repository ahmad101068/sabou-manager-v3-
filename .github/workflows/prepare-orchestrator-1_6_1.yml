name: Prepare AndroidX Test Orchestrator 1.6.1

on:
  push:
    branches:
      - tools/offline-android-deps
    paths:
      - .github/workflows/prepare-orchestrator-1_6_1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Resolve official AndroidX Test Orchestrator artifacts
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/orchestrator-resolve"
          OUT="$RUNNER_TEMP/orchestrator-out"
          mkdir -p "$WORK" "$OUT"
          cat > "$WORK/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'orchestrator-resolve'
          EOF
          cat > "$WORK/build.gradle" <<'EOF'
          configurations { orchestrator }
          dependencies { orchestrator 'androidx.test:orchestrator:1.6.1' }
          tasks.register('resolveOrchestrator', Copy) {
              from configurations.orchestrator
              into layout.buildDirectory.dir('resolved')
          }
          EOF
          cd "$WORK"
          gradle --no-daemon resolveOrchestrator
          cp -a "$WORK/build/resolved/." "$OUT/"
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find "$OUT" -maxdepth 1 -type f -name 'orchestrator-1.6.1*' -print -quit)"
          sha256sum "$OUT"/* | sort > "$OUT/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: androidx-test-orchestrator-1.6.1
          path: ${{ runner.temp }}/orchestrator-out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
