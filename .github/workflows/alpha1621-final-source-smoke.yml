name: Alpha162.1 Final Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [alpha1621-final-readiness]
    paths:
      - ".github/workflows/alpha1621-final-source-smoke.yml"
      - "_ci/prepare-alpha1621-final.sh"
      - "_ci/final-source-code.parts/**"
      - "_ci/alpha1621_compilefix.patch"
      - "Sabou-Restaurant-ERP-Alpha162.1-Enterprise-Core-Completion-SOURCE.zip"

permissions:
  contents: read
  actions: read

concurrency:
  group: alpha1621-final-source-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Download official Room schemas from verified KSP run
        uses: actions/download-artifact@v5
        with:
          name: alpha1621-official-room-schemas-45-47
          path: _official_schemas
          repository: ahmad101068/sabou-manager-v3-
          run-id: 31538593586
          github-token: ${{ github.token }}
      - name: Prepare exact final source
        shell: bash
        run: bash _ci/prepare-alpha1621-final.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-provider: basic
      - name: Install verifier dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi
      - name: Static and architecture gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash scripts/verify-foundation.sh
          bash scripts/verify-alpha161-professional-erp.sh
          python3 scripts/verify-alpha161-sql.py
          python3 scripts/verify-alpha161-ci-logfix.py
          python3 scripts/verify-hr-payroll-migration.py
          python3 scripts/verify-runtime-crash-repair.py
          python3 scripts/verify-alpha162-enterprise-core.py
          python3 scripts/verify-alpha162-room-schemas.py
          python3 scripts/verify-alpha162-code-quality.py
      - name: Clean
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain clean --stacktrace
      - name: Compile debug Kotlin
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileDebugKotlin --stacktrace
      - name: Compile release Kotlin
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain compileReleaseKotlin --stacktrace
      - name: Unit tests
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain testDebugUnitTest --stacktrace
      - name: Lint debug
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain lintDebug --stacktrace
      - name: Assemble debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebug --stacktrace
      - name: Assemble AndroidTest APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleDebugAndroidTest --stacktrace
      - name: Assemble release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --console=plain assembleRelease --stacktrace
