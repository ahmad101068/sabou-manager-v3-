name: Phase 3 Part 3B Targeted Regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase3-part3b-targeted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TARGETED_TESTS: ir.restaurant.management.data.repository.Phase2CorrectionIntegrationTest#actualFoodCostIsUnavailableWithoutIndependentEvidenceAndChangesWithWaste,ir.restaurant.management.ui.DashboardNavigationSettingsUx2ComposeTest#ownerHome_hasFourPrimarySections_andNoAuditOrModuleDump,ir.restaurant.management.ui.DashboardNavigationSettingsUx2ComposeTest#cashierHome_filtersSensitiveKpisAndActionsBeforeRendering,ir.restaurant.management.ui.DashboardNavigationSettingsUx2ComposeTest#inventoryHome_showsInventoryContext_withoutFinancialKpis,ir.restaurant.management.ui.DashboardNavigationSettingsUx2ComposeTest#controlChildren_renderAndKeepControlSelected,ir.restaurant.management.ui.EnterpriseCoreComposeE2ETest#inventoryCount_uiRecordApproveAndPost_reachesPostedWithoutChangingExactBalance,ir.restaurant.management.ui.StartupAuthenticationBoundaryComposeTest#ownerWithPayrollPermission_afterLoginCanLoadPayrollWorkspace,ir.restaurant.management.ui.StartupAuthenticationBoundaryComposeTest#cashierWithoutPayrollPermission_logsInWithoutPayrollSubscription_andLogoutTearsDownProtectedGraph

jobs:
  targeted-connected:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reconstruct exact Part 3B candidate
        run: bash .github/scripts/reconstruct-part3b-candidate.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Clean targeted candidate outputs
        working-directory: phase3-source
        run: gradle --no-daemon clean
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Targeted connected regressions
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: cd "$GITHUB_WORKSPACE/phase3-source" && gradle --no-daemon --no-build-cache :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=$TARGETED_TESTS"
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-targeted-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            phase3-source/app/build/outputs/androidTest-results/connected/**
            phase3-source/app/build/reports/androidTests/connected/**
          if-no-files-found: error
          retention-days: 7

  targeted-16kb:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reconstruct exact Part 3B candidate
        run: bash .github/scripts/reconstruct-part3b-candidate.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.13'
      - name: Clean targeted 16KB candidate outputs
        working-directory: phase3-source
        run: gradle --no-daemon clean
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Targeted 16KB regressions
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          script: cd "$GITHUB_WORKSPACE/phase3-source" && page_size=$(adb shell getconf PAGESIZE | tr -d '\r') && echo "RUNTIME_PAGE_SIZE=$page_size" && test "$page_size" = "16384" && gradle --no-daemon --no-build-cache :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=$TARGETED_TESTS"
      - name: Upload targeted 16KB evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase3-targeted-16kb-${{ github.sha }}
          path: |
            phase3-source/app/build/outputs/androidTest-results/connected/**
            phase3-source/app/build/reports/androidTests/connected/**
          if-no-files-found: error
          retention-days: 7
