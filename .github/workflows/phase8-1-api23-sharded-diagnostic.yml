name: Phase 8.1 API23 Sharded Diagnostic
on:
  push:
    branches: [diagnostic/phase8-1-api23-shards]
permissions:
  contents: read
  actions: read
jobs:
  api23-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SOURCE_SHA: f176bd9fb077d6a6013bce07423a458b89d4a76f
      PHASE8_BASELINE_SHA: 38b2b13883bcb806796c9de41ac8914a8974b016
      SOURCE_BRANCH: remediation/phase8-1-final-production-closure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
      - name: Reconstruct exact Phase 8.1 release candidate
        run: bash .github/scripts/reconstruct-phase8-1-release-candidate.sh phase8-1-source
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API23 shard ${{ matrix.shard }} of 4
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 768M
          disable-animations: true
          script: >-
            cd "$GITHUB_WORKSPACE/phase8-1-source" &&
            gradle --no-daemon --no-build-cache :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.numShards=4
            -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }}
